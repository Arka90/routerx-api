name: RouteRx CI/CD

on:
  push:
    branches: [master, main]

jobs:

  test:
    runs-on: ubuntu-latest

    # The suite defaults to an in-process Postgres, but CI runs it against a
    # real server so the production `pg` driver and its type parsing are
    # exercised too, not just the SQL.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: routerx
          POSTGRES_PASSWORD: routerx
          POSTGRES_DB: routerx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U routerx"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://routerx:routerx@localhost:5432/routerx_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run build

      - name: Run tests
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via Docker
        uses: appleboy/ssh-action@v1.0.3
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
          GENERAL_FROM: ${{ secrets.GENERAL_FROM }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          APP_URL: ${{ secrets.APP_URL }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: SMTP_HOST,SMTP_PORT,SMTP_USER,SMTP_PASS,ALERT_FROM,GENERAL_FROM,JWT_SECRET,CORS_ORIGINS,APP_URL,POSTGRES_PASSWORD
          script: |

            set -e

            echo "---- GO TO APP DIR ----"
            cd ~/apps/routerx-api || exit 1

            echo "---- UPDATE REPO ----"
            git fetch --all
            git reset --hard origin/master
            git clean -fd

            echo "---- WRITE ENV ----"
            cat > .env << EOF
            NODE_ENV=production
            PORT=3000
            REDIS_HOST=redis
            TRUST_PROXY=1
            APP_URL=$APP_URL
            CORS_ORIGINS=$CORS_ORIGINS
            PROBE_RETENTION_DAYS=30
            WORKER_CONCURRENCY=10
            POSTGRES_USER=routerx
            POSTGRES_PASSWORD=$POSTGRES_PASSWORD
            POSTGRES_DB=routerx
            DATABASE_URL=postgres://routerx:$POSTGRES_PASSWORD@postgres:5432/routerx
            SMTP_HOST=$SMTP_HOST
            SMTP_PORT=$SMTP_PORT
            SMTP_USER=$SMTP_USER
            SMTP_PASS=$SMTP_PASS
            ALERT_FROM=$ALERT_FROM
            GENERAL_FROM=$GENERAL_FROM
            JWT_SECRET=$JWT_SECRET
            EOF

            echo "---- BUILD & START CONTAINERS ----"
            docker compose pull
            docker compose up -d --build --remove-orphans

            echo "---- CLEAN OLD IMAGES ----"
            docker image prune -af

